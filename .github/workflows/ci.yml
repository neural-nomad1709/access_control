name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test suite (${{ matrix.mode.name }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the platform operators actually run this from (pywin32,
        # CredUI); Linux covers the SSH/paramiko path and keeps CI honest
        # about accidental platform assumptions. The suite is fully offline.
        os: [ubuntu-latest, windows-latest]
        # standalone: the plain install, with no AgentLighthouse anywhere — the
        # tests that need it skip. integrated: the opt-in extra and test group,
        # taken from the release tag pinned in pyproject.toml.
        mode:
          - name: standalone
            flags: ""
          - name: integrated
            flags: "--extra lighthouse --group lighthouse-test"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen --extra dev ${{ matrix.mode.flags }}

      - name: Test suite
        run: uv run --frozen --extra dev ${{ matrix.mode.flags }} pytest
