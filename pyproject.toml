[project]
name = "access-control"
version = "0.2.0"
description = "Multi-hop bastion automation utility: lets Claude run audited operations on SSH and Windows servers reached through a chain of jump hosts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # <5: paramiko 5.0 dropped 'ssh-rsa' from Transport._key_info entirely, not
    # just from its default preference order -- some production bastions only
    # offer that host key algorithm, and 5.x can never negotiate it.
    "paramiko>=3.4,<5",
    "pypsrp>=0.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# AgentLighthouse governance plane, embedded (LighthouseGatekeeper). During
# development this points at the sibling clone; al-verify must be pinned as a
# source too because al-core's own dependency on it is a uv-workspace source,
# invisible to an external consumer.
lighthouse = [
    "al-core",
]

[tool.uv.sources]
# editable: AL's .gitignore has a `keys` pattern (signing-key material), and a
# wheel built from the path drops the al_core.keys package with it. The source
# tree, not a build, is the dependency during development.
al-core = { path = "../AgentLighthouse/core", editable = true }
al-verify = { path = "../AgentLighthouse/verify", editable = true }

[project.scripts]
ac = "access_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Auditor-side tooling used only by the Phase 4 attestation test — it
    # proves an ac-operation posture attestation verifies. Not a runtime
    # dependency: ac never embeds the governance layer.
    "al-governance",
]

[tool.uv.sources.al-governance]
path = "../AgentLighthouse/governance"
editable = true
