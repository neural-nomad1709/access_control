[project]
name = "access-control"
version = "0.2.0"
description = "Multi-hop bastion automation utility: lets Claude run audited operations on SSH and Windows servers reached through a chain of jump hosts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # <5: paramiko 5.0 dropped 'ssh-rsa' from Transport._key_info entirely, not
    # just from its default preference order -- some production bastions only
    # offer that host key algorithm, and 5.x can never negotiate it.
    "paramiko>=3.4,<5",
    "pypsrp>=0.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# AgentLighthouse governance plane, embedded (LighthouseGatekeeper). Opt-in:
# nothing in a plain install names it.
lighthouse = [
    "agentlighthouse-core",
]

# AgentLighthouse comes from one released tag, never from a sibling checkout:
# uv validates every source on each `uv sync` / `uv run`, so a path source makes
# the standalone tool depend on that checkout existing and matching. Move to a
# newer release by changing the tag on all three lines, then `uv lock`.
# agentlighthouse-verify needs its own source because agentlighthouse-core's
# dependency on it is a uv-workspace source, invisible to an external consumer.
[tool.uv.sources]
agentlighthouse-core = { git = "https://github.com/neural-nomad1709/agentlighthouse", tag = "v0.4.0", subdirectory = "core" }
agentlighthouse-verify = { git = "https://github.com/neural-nomad1709/agentlighthouse", tag = "v0.4.0", subdirectory = "verify" }
agentlighthouse-governance = { git = "https://github.com/neural-nomad1709/agentlighthouse", tag = "v0.4.0", subdirectory = "governance" }

[project.scripts]
ac = "access_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Auditor-side tooling used only by the Phase 4 attestation test — it proves an
# ac-operation posture attestation verifies. Not a runtime dependency: ac never
# embeds the governance layer.
lighthouse-test = [
    "agentlighthouse-governance",
]
