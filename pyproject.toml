[project]
name = "access-control"
version = "0.1.0"
description = "Multi-hop bastion automation utility: lets Claude run audited operations on SSH and Windows servers reached through a chain of jump hosts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # <5: paramiko 5.0 dropped 'ssh-rsa' from Transport._key_info entirely, not
    # just from its default preference order -- some production bastions only
    # offer that host key algorithm, and 5.x can never negotiate it.
    "paramiko>=3.4,<5",
    "pypsrp>=0.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ac = "access_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
